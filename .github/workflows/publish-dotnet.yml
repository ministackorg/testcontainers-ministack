name: Publish to NuGet

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dotnet

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Verify (build + test) before publish
        run: |
          dotnet build --configuration Release
          dotnet test --configuration Release --no-build

      - name: Pack
        run: dotnet pack src/Testcontainers.MiniStack --configuration Release --no-build --output artifacts

      # The package version comes from Testcontainers.MiniStack.csproj, as the Maven
      # version comes from pom.xml. --skip-duplicate lets a tag that only bumps the
      # Java version pass without failing.
      - name: Publish to NuGet
        run: dotnet nuget push "artifacts/*.nupkg" --api-key "$NUGET_API_KEY" --source https://api.nuget.org/v3/index.json --skip-duplicate
        env:
          NUGET_API_KEY: ${{ secrets.NUGET_API_KEY }}
